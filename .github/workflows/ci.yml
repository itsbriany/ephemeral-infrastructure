name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up supported Node.js runtime for AWS CDK
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.4"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -v

      - name: Synthesize the Milestone 2 control plane
        run: uv run python app.py

      - name: Confirm the synthesized workload boundary
        run: |
          uv run python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          template_path = Path("cdk.out/EphemeralEnvironments-ControlPlane.template.json")
          template = json.loads(template_path.read_text())
          resources = template.get("Resources", {})
          resource_types = Counter(resource["Type"] for resource in resources.values())
          expected = {
              "AWS::ApiGatewayV2::Api": 1,
              "AWS::DynamoDB::Table": 1,
              "AWS::Lambda::Function": 4,
          }
          for resource_type, count in expected.items():
              if resource_types[resource_type] != count:
                  raise SystemExit(
                      f"Expected {count} {resource_type} resources; found "
                      f"{resource_types[resource_type]}"
                  )
          forbidden_prefixes = ("AWS::ECS::", "AWS::StepFunctions::")
          forbidden = sorted(
              resource_type
              for resource_type in resource_types
              if resource_type.startswith(forbidden_prefixes)
          )
          if forbidden:
              raise SystemExit(f"Milestone 2 synthesized workload resources: {forbidden}")
          print("Milestone 2 contains the persistent control plane and no workload resources.")
          PY
