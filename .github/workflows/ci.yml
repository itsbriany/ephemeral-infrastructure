name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up supported Node.js runtime for AWS CDK
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest-known"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -v

      - name: Synthesize the Milestone 0 cloud assembly
        run: uv run python app.py

      - name: Confirm the synthesized stack contains no resources
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          template_path = Path("cdk.out/EphemeralEnvironments-ControlPlane.template.json")
          template = json.loads(template_path.read_text())
          resources = template.get("Resources", {})
          if resources:
              raise SystemExit(f"Milestone 0 unexpectedly synthesized resources: {resources}")
          print("Milestone 0 synthesis contains no AWS resources.")
          PY
